skill: karpathy-style
priority: high
description: 以 Andrej Karpathy 的编码哲学为核心，追求清晰、扁平、显式的代码结构

activation:
  trigger_on:
    - "新建文件或模块"
    - "设计 API 或接口"
    - "定义数据结构或类"
    - "代码审查中发现抽象过度"
  auto_trigger: true

principles:
  1_naming:
    rule: "变量/函数名即文档"
    standards:
      - "使用完整单词，避免缩写（除行业通用如 http, idx, ctx）"
      - "布尔值使用 is/has/should/can 前缀"
      - "函数名使用动词+名词（get_user_config, not getConfig）"
      - "Python: snake_case | JS/TS: camelCase | Go: mixedCase | Java/C++: camelCase"

  2_structure:
    rule: "扁平优于嵌套，显式优于隐式"
    standards:
      - "避免深层继承（>2层需注释说明必要性）"
      - "优先使用组合而非继承"
      - "避免魔术数字/字符串，使用具名常量"
      - "配置文件显式化，拒绝隐式约定"

  3_clarity:
    rule: "代码应像散文一样可读"
    standards:
      - "单个函数不超过 50 行（超出必须拆分）"
      - "单个文件不超过 500 行（超出考虑模块化）"
      - "避免一行多操作（除简单元组解包）"
      - "复杂逻辑必须配注释说明'为什么'，而非'做什么'"

  4_explicitness:
    rule: "拒绝隐式魔法"
    standards:
      - "显式导入所有依赖（拒绝 * import）"
      - "显式处理所有错误路径"
      - "显式类型注解（Python 3.9+ 使用标准类型，TS 严格模式）"
      - "显式资源释放（defer/try-finally/RAII）"

constraints:
  - "禁止为'可能未来需要'创建抽象基类或接口"
  - "禁止使用元编程/反射解决本可用简单逻辑解决的问题"
  - "禁止在业务代码中使用设计模式除非当前痛点明确需要"

exit_criteria:
  - "函数平均行数 <= 30"
  - "无深层嵌套（>3层）"
  - "所有命名自解释，无需额外注释说明'做什么'"
