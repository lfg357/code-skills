skill: bug-fix
priority: highest
description: 根因驱动的最小化修复

activation:
  trigger_on:
    - "错误日志/堆栈分析"
    - "测试失败"
    - "用户报告异常行为"
    - "代码审查中发现逻辑错误"
  auto_trigger: true

methodology:
  1_reproduction:
    rule: "先复现，后修复"
    steps:
      - "分析错误信息：定位文件、函数、行号"
      - "构建最小复现案例（MCVE）"
      - "确认复现环境（语言版本、依赖版本、操作系统）"
      - "区分：必现/偶现/特定输入触发"

  2_root_cause:
    rule: "找到根因，而非症状"
    analysis:
      - "追溯数据流：错误值从何处引入"
      - "检查时序问题：异步/并发/事件顺序"
      - "检查状态变更：可变状态、全局变量、副作用"
      - "检查假设违背：空值、类型不匹配、范围溢出"

  3_fix:
    rule: "最小修改，最大安全"
    standards:
      - "修复应针对根因，而非掩盖症状（禁止 catch-all 吞异常）"
      - "优先修复数据校验/前置条件"
      - "并发问题优先使用不可变数据或标准同步原语"
      - "修复后必须考虑：是否引入回归？边界情况是否覆盖？"

  4_verification:
    steps:
      - "复现案例必须通过"
      - "原有相关测试必须通过"
      - "检查相似代码是否存在相同缺陷（横向排查）"

constraints:
  - "禁止在未理解根因前修改代码"
  - "禁止用 try-catch 掩盖逻辑错误"
  - "禁止引入新依赖来修复简单逻辑错误"
  - "禁止修改与 bug 无关的代码（即使它看起来可以'顺便优化'）"

exit_criteria:
  - "MCVE 通过"
  - "原有测试通过"
  - "横向排查完成"
