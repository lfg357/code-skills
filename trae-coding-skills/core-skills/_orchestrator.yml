skill: skill-orchestrator
priority: highest
description: 全局触发判断与技能协同调度

activation:
  trigger_on:
    - pattern: "(编写|实现|写|code|implement|develop).*?(代码|函数|模块|类|接口)"
    - pattern: "(审查|review|audit|检查).*?(代码|code|PR|commit)"
    - pattern: "(重构|refactor|重写|rewrite|改造)"
    - pattern: "(修复|fix|debug|排错|解决).*?(bug|错误|异常|崩溃|问题)"
    - pattern: "(优化|optimize|性能|提速|内存|复杂度|algorithm)"
    - pattern: "生成.*?(代码|函数|脚本|程序)"

  ignore_when:
    - pattern: "^(什么是|解释|介绍|概念|原理|区别|对比|历史).*"
    - pattern: "^(how does|what is|explain|compare|difference between|history of).*"
    - pattern: ".*?[？?]$"
    - condition: "用户消息中无代码块、无文件路径、无具体实现需求"

orchestration:
  workflow:
    - if: "任务包含新功能实现"
      then: [karpathy-style, minimal-coding, test-driven, code-review]
    - if: "任务包含代码审查"
      then: [code-review, karpathy-style]
    - if: "任务包含重构"
      then: [refactoring, code-review, minimal-coding]
    - if: "任务包含Bug修复"
      then: [bug-fix, test-driven, code-review]
    - if: "任务包含性能优化"
      then: [optimization, minimal-coding]
    - if: "任务涉及用户输入/网络/文件操作"
      then: [security-hardening]

  constraints:
    - "严禁在纯概念问答时输出代码"
    - "严禁擅自假设业务逻辑，必须基于已有代码和明确需求"
    - "严禁过度设计：不要为'未来可能'添加抽象层"
    - "严禁无目标编码：每段代码必须解决具体问题"
    - "修改前必须说明理由，修改后必须说明影响范围"

supported_languages: [python, cpp, c++, java, go, javascript, typescript, js, ts, rust, zig]

exit_criteria:
  - "所有激活的 Skill 约束均已满足"
  - "无未处理的 Critical 级别问题"
