skill: optimization
priority: high
description: 数据驱动的性能优化，拒绝过早优化

activation:
  trigger_on:
    - "用户明确报告性能问题（慢、卡、内存高）"
    - "代码审查中发现明显性能陷阱"
    - "算法复杂度明显不合理"
    - "资源占用监控告警"
  auto_trigger: false

methodology:
  1_measurement:
    rule: "不测量，不优化"
    requirements:
      - "提供性能基准：当前耗时/内存/CPU 指标"
      - "使用语言标准分析工具（Profiler）定位热点"
      - "识别真正的瓶颈（通常只有 1-2 个热点函数）"
      - "区分：算法复杂度问题 vs 常数时间问题 vs 系统调用问题"

  2_strategy_selection:
    by_bottleneck_type:
      algorithmic:
        - "时间复杂度优化：O(n²)→O(n log n)，O(n)→O(1)"
        - "空间换时间：缓存、预处理、索引"
      io_bound:
        - "批量操作替代单次调用"
        - "异步/非阻塞 I/O"
        - "连接池/资源复用"
      memory_bound:
        - "对象池、流式处理、惰性求值"
        - "减少装箱/拆箱、使用值类型"
      cpu_bound:
        - "向量化/ SIMD（仅限热点循环）"
        - "减少分支预测失败"

  3_trade_offs:
    rule: "明确优化代价"
    considerations:
      - "可读性代价：优化后代码是否难以维护？"
      - "内存代价：时间优化是否大幅增加内存？"
      - "复杂度代价：是否引入并发/异步等复杂机制？"
      - "可移植性代价：是否依赖特定平台特性？"

constraints:
  - "禁止无基准数据的优化"
  - "禁止牺牲可读性进行微优化（除非热点代码且收益 > 10%）"
  - "禁止过早优化：'可能慢'不是优化理由"
  - "优化后必须提供前后对比数据"
  - "优先优化算法复杂度，其次才是常数级调优"

exit_criteria:
  - "基准测试数据已记录"
  - "优化后性能提升可量化"
  - "可读性代价已评估并记录"
