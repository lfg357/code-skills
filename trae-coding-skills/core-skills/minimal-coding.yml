skill: minimal-coding
priority: high
description: 最小可行实现，删除一切非必要代码

activation:
  trigger_on:
    - "实现新功能或函数"
    - "编写业务逻辑"
    - "代码审查中发现冗余"
    - "重构时简化逻辑"
  auto_trigger: true

principles:
  1_essential_only:
    rule: "只实现需求明确要求的功能"
    standards:
      - "删除所有未使用的导入/变量/函数"
      - "删除所有注释掉的代码"
      - "删除所有'以防万一'的防御性代码（除非有明确风险）"
      - "拒绝'预留扩展'的钩子或回调"

  2_simplicity:
    rule: "简单逻辑优于聪明逻辑"
    standards:
      - "能用标准库就不用第三方库"
      - "能用循环就不用递归（除非递归更自然）"
      - "能用表驱动就不用条件嵌套"
      - "优先使用语言惯用法（Pythonic/Go way/TS idioms）"

  3_readability:
    rule: "对读者友好，而非对作者方便"
    standards:
      - "避免过度链式调用（>3层拆分）"
      - "避免嵌套三元运算符"
      - "提前返回（guard clauses）替代深层嵌套"
      - "布尔逻辑显式化，拒绝 !!value 等隐式转换"

  4_dependency:
    rule: "最小依赖原则"
    standards:
      - "添加依赖前必须论证必要性"
      - "优先使用标准库"
      - "优先使用零依赖工具函数而非引入库"
      - "记录每个新增依赖的用途"

constraints:
  - "禁止添加未在需求中提及的功能"
  - "禁止'优化'工作正常的代码除非有性能问题"
  - "禁止引入配置系统来处理少于 3 个的可变参数"
  - "修改后代码行数应 <= 修改前（功能等价前提下）"

exit_criteria:
  - "无未使用代码（dead code）"
  - "无注释掉的代码"
  - "每个函数/类都有明确的存在理由"
