language: base
version: "*"
description: 语言层通用基础规则，所有语言模块继承

extends: core-skills

base_rules:
  formatting:
    - "统一缩进（按语言惯例：Python 4空格 / Go Tab / JS 2空格）"
    - "统一换行符（LF）"
    - "文件末尾空行"

  naming:
    - "常量：UPPER_SNAKE_CASE"
    - "私有成员：_prefix 或 private 关键字"
    - "避免单字母变量（循环索引 i/j/k 除外）"

  imports:
    - "按标准库、第三方、本地模块分组"
    - "每组按字母序排序"
    - "禁止循环导入"
